[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-harny"
version = "0.1.0"
description = "Harny for Strands agents: long-term memory of each customer that keeps up when facts change."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Harny", email = "build@harny.ai" }]
keywords = ["strands", "strands-agents", "harny", "memory", "agents", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "strands-agents>=1.66.0",
    "harny>=0.1.8,<1",
]

[project.urls]
Homepage = "https://harny.ai"
Source = "https://github.com/harny-ai/strands-harny"
Documentation = "https://harny.ai/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strands_harny"]

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
